name: DailyHealthScore
options:
  bundleIdPrefix: com.dailyhealthscore
  # iOS 27 runs on every iPhone that ran iOS 26, and it is the floor for the
  # Private Cloud Compute model, reasoning, and the 8K on-device window the
  # Lifestyle Coach is built on. The Watch companion needs nothing past 26.
  deploymentTarget:
    iOS: "27.0"
    watchOS: "26.0"
  xcodeVersion: "27.0"
  # Pin Embed Watch Content to Watch/. Apple's App Store layout (and iOS
  # Available Apps) expect the companion there. Some XcodeGen versions would
  # put it in PlugIns/ instead.
  postGenCommand: python3 scripts/patch_watch_embed.py
settings:
  SWIFT_VERSION: "5.9"
  MARKETING_VERSION: "1.7.0"
  CURRENT_PROJECT_VERSION: "24"
targets:
  DailyHealthScore:
    type: application
    platform: iOS
    sources:
      - path: DailyHealthScore
        excludes:
          - "**/.DS_Store"
      - path: DailyHealthScoreShared
        excludes:
          - "**/.DS_Store"
    settings:
      # App Store listing is com.dailyhealthscore.app.mf. Watch companion IDs
      # must stay prefixed by this exact string.
      PRODUCT_BUNDLE_IDENTIFIER: com.dailyhealthscore.app.mf
      INFOPLIST_FILE: DailyHealthScore/Info.plist
      CODE_SIGN_ENTITLEMENTS: DailyHealthScore/DailyHealthScore.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # iPhone-only. Adding iPad ("1,2") would also require declaring iPad
      # interface orientations in Info.plist or setting UIRequiresFullScreen.
      TARGETED_DEVICE_FAMILY: "1"
      MARKETING_VERSION: "1.7.0"
      CURRENT_PROJECT_VERSION: "24"
      OTHER_CODE_SIGN_FLAGS: --generate-entitlement-der
      # Allow the Debug Watch/PlugIns mirror to write into the .app after embed.
      ENABLE_USER_SCRIPT_SANDBOXING: NO
    entitlements:
      path: DailyHealthScore/DailyHealthScore.entitlements
    dependencies:
      - target: DailyHealthScoreWatch
        embed: true
        codeSign: true
        link: false
    postBuildScripts:
      # Do not list script outputs. Embed Watch Content already writes the
      # companion bundle; a second claimed path fails as Multiple commands produce.
      - name: Mirror Watch companion into PlugIns for Debug device install
        basedOnDependencyAnalysis: false
        path: scripts/mirror_watch_for_debug_install.sh

  DailyHealthScoreWatch:
    type: application
    platform: watchOS
    sources:
      - path: DailyHealthScoreWatch
        excludes:
          - "**/.DS_Store"
      - path: DailyHealthScoreShared
        excludes:
          - "**/.DS_Store"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.dailyhealthscore.app.mf.watchkitapp
      INFOPLIST_FILE: DailyHealthScoreWatch/Info.plist
      INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.dailyhealthscore.app.mf
      INFOPLIST_KEY_WKWatchOnlyApp: false
      INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: false
      CODE_SIGN_ENTITLEMENTS: DailyHealthScoreWatch/DailyHealthScoreWatch.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "4"
      SDKROOT: watchos
      SKIP_INSTALL: YES
      # Ultra 4 / S11 and Series 9+ are 64-bit. watchOS 27 hides apps that
      # lack an arm64 slice. Do not thin to the last-selected Series 10.
      ARCHS: arm64
      ONLY_ACTIVE_ARCH: NO
      "EXCLUDED_ARCHS[sdk=watchos*]": "arm64_32 armv7k"
      OTHER_CODE_SIGN_FLAGS: --generate-entitlement-der
      MARKETING_VERSION: "1.7.0"
      CURRENT_PROJECT_VERSION: "24"
    entitlements:
      path: DailyHealthScoreWatch/DailyHealthScoreWatch.entitlements
    dependencies:
      - target: DailyHealthScoreWatchWidgets
        embed: true
        codeSign: true
      - sdk: HealthKit.framework

  DailyHealthScoreWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: DailyHealthScoreWatchWidgets
        excludes:
          - "**/.DS_Store"
      - path: DailyHealthScoreShared
        excludes:
          - "**/.DS_Store"
          - PaceNudgeScheduler.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.dailyhealthscore.app.mf.watchkitapp.widgets
      INFOPLIST_FILE: DailyHealthScoreWatchWidgets/Info.plist
      CODE_SIGN_ENTITLEMENTS: DailyHealthScoreWatchWidgets/DailyHealthScoreWatchWidgets.entitlements
      TARGETED_DEVICE_FAMILY: "4"
      SDKROOT: watchos
      SKIP_INSTALL: YES
      APPLICATION_EXTENSION_API_ONLY: YES
      ARCHS: arm64
      ONLY_ACTIVE_ARCH: NO
      "EXCLUDED_ARCHS[sdk=watchos*]": "arm64_32 armv7k"
      OTHER_CODE_SIGN_FLAGS: --generate-entitlement-der
      LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks
      MARKETING_VERSION: "1.7.0"
      CURRENT_PROJECT_VERSION: "24"
    entitlements:
      path: DailyHealthScoreWatchWidgets/DailyHealthScoreWatchWidgets.entitlements
    dependencies:
      - sdk: HealthKit.framework
      - sdk: WatchConnectivity.framework

  DailyHealthScoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DailyHealthScoreTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: DailyHealthScore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.dailyhealthscore.app.mf.tests
      GENERATE_INFOPLIST_FILE: "YES"
      TARGETED_DEVICE_FAMILY: "1"
schemes:
  DailyHealthScore:
    build:
      targets:
        DailyHealthScore: all
        DailyHealthScoreWatch: all
        DailyHealthScoreWatchWidgets: all
        DailyHealthScoreTests: [test]
    test:
      targets:
        - DailyHealthScoreTests
  DailyHealthScoreWatch:
    build:
      targets:
        DailyHealthScoreWatch: all
        DailyHealthScoreWatchWidgets: all
        DailyHealthScore: [run, archive]
    run:
      config: Debug
      executable: DailyHealthScoreWatch
